# Xiaomi Redmi Note 13 4G (sapphire) -- Qualcomm Snapdragon 685 (SM6225-AD Bengal).
# Hardware parameters verified on physical device:
# Framebuffer: 1080x2400 AMOLED continuous splash at 0x5c000000
# Interrupt Controller: GICv3 GICD 0x0f200000, GICR 0x0f300000
# CPUs: 4x Cortex-A73 Gold (MPIDR 0x100..0x103) + 4x Cortex-A53 Silver (MPIDR 0x0..0x3)
NAME="Redmi Note 13 4G (sapphire)"
KIND=phone
SOC="Qualcomm Snapdragon 685 (SM6225)"

# --- boot chain (phones) ---------------------------------------------------------------------------
UEFI_TARGET=sapphire
UEFI_FD=
DTB=
FD_BASE=0x9FD00000
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000

# --- interrupt controller --------------------------------------------------------------------------
GIC_DIST=0x0f200000
GIC_REDIST=0x0f300000

# --- kernel and loader -----------------------------------------------------------------------------
FB_BASE=0x5c000000              # 1080x2400 AMOLED continuous splash; xnuloader picks platform_sapphire by it
WIFI_ATH11K=0                   # SM6225 Wi-Fi is WCN3988 (topaz), not ath11k

# --- what the run needs ----------------------------------------------------------------------------
BOOTARGS="cpus=8 cpufreq=1 serial=3 debug=0xc"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""
