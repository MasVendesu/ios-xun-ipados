# Xiaomi Redmi Pad SE (xun) -- Qualcomm Snapdragon 680 (SM6225 khaje), 11-inch tablet.
# Same SoC family and memory map as sapphire (Redmi Note 13 4G); different panel,
# and eMMC on sdhc_1 instead of UFS.
# Framebuffer: 1200x1920 continuous splash at 0x5c000000 (15 MiB region)
# Interrupt Controller: GICv3 GICD 0x0f200000, GICR 0x0f300000
# CPUs: 4x Cortex-A73 Gold (MPIDR 0x100..0x103) + 4x Cortex-A53 Silver (MPIDR 0x0..0x3)
# Storage: eMMC, SDHCI host at 0x04744000 (the root goes into `userdata`)
NAME="Redmi Pad SE (xun)"
KIND=phone
SOC="Qualcomm Snapdragon 680 (SM6225)"

# --- boot chain (phones) ---------------------------------------------------------------------------
UEFI_TARGET=xun
UEFI_FD=
DTB=
FD_BASE=0x9FD00000
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000

# --- interrupt controller --------------------------------------------------------------------------
GIC_DIST=0x0f200000
GIC_REDIST=0x0f300000

# --- kernel and loader -----------------------------------------------------------------------------
FB_BASE=0x5c000000              # 1200x1920 splash; xnuloader picks platform_xun by it
WIFI_ATH11K=0                   # SM6225 Wi-Fi is WCN3988 (topaz), not ath11k
EMMC=1                          # eMMC root (bsd/dev/xun_emmc.c), no UFS on this board

# --- what the run needs ----------------------------------------------------------------------------
BOOTARGS="cpus=4 cpufreq=1 serial=3 debug=0xc emmcroot=userdata"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""
